name: Build Android APK

# Runs on every push to main branch
on:
  push:
    branches: [main]
  workflow_dispatch: # also allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Must come before cap add android; v5 fixes Node.js 24 runner compatibility
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Add Android platform
        run: npx cap add android

      - name: Prepare web assets in www/
        run: |
          mkdir -p www
          cp index.html style.css script.js manifest.json sw.js icon-192.png icon-512.png www/

      - name: Sync web assets into Android project
        run: npx cap sync android

      # Install ImageMagick explicitly — not guaranteed pre-installed on all runner images
      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Generate Android launcher icons
        run: |
          # Remove adaptive icon XMLs — they override flat PNGs on Android 8+; flat PNGs are sufficient
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for density in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir="${density%%:*}"; size="${density##*:}"
            mkdir -p android/app/src/main/res/mipmap-$dir
            convert icon-512.png -resize ${size}x${size} android/app/src/main/res/mipmap-$dir/ic_launcher.png
            cp android/app/src/main/res/mipmap-$dir/ic_launcher.png android/app/src/main/res/mipmap-$dir/ic_launcher_round.png
          done

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flappy-bird-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
